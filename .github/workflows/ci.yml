name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: Structure and layer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: pip install pyyaml pytest
      - name: Layer and structure check
        run: python3 tools/check_layers.py
      - name: Checker unit tests
        run: python3 -m pytest tools/tests -q

  build:
    name: CMake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y tcl-dev bison flex libfl-dev swig libeigen3-dev libboost-dev zlib1g-dev libspdlog-dev
      - name: Configure
        run: cmake -S . -B build -DEOS_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --no-tests=ignore --output-on-failure
