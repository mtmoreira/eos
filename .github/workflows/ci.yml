name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: Structure and layer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: pip install pyyaml pytest
      - name: Layer and structure check
        run: python3 tools/check_layers.py
      - name: Dependency graph check
        run: python3 tools/dep_graph.py check
      - name: Shell script syntax check
        run: |
          bash -n scripts/setup-macos.sh
          bash -n scripts/build-macos.sh
      - name: Checker unit tests
        run: python3 -m pytest tools/tests -q

  build:
    name: CMake build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the pull-request selection step can diff
          # against the base commit. Push runs (including merge
          # commits) always run the full suite, so they do not use it.
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y tcl-dev bison flex libfl-dev swig libeigen3-dev libboost-dev libboost-serialization-dev zlib1g-dev libspdlog-dev libfmt-dev liblemon-dev qt6-base-dev qt6-base-dev-tools
      - name: Cache OR-Tools (P2 declared external dependency, never vendored)
        id: cache-ortools
        uses: actions/cache@v4
        with:
          # Exact asset version in the key, so a version bump never
          # restores a stale install. The GitHub release download
          # flaps between 200 and 504, so a cold cache must not
          # fail the whole run; the install step retries the
          # download when it has to fetch.
          path: ~/or-tools
          key: or-tools-9.5.2237-ubuntu-22.04
      - name: Install OR-Tools (P2 declared external dependency, never vendored)
        if: steps.cache-ortools.outputs.cache-hit != 'true'
        run: |
          curl --retry 5 --retry-delay 10 -L -o /tmp/or-tools.tar.gz https://github.com/google/or-tools/releases/download/v9.5/or-tools_amd64_ubuntu-22.04_cpp_v9.5.2237.tar.gz
          mkdir -p "$HOME/or-tools"
          tar -xzf /tmp/or-tools.tar.gz -C "$HOME/or-tools" --strip-components=1
      - name: Configure
        run: cmake -S . -B build -DEOS_BUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$HOME/or-tools"
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
      - name: Select affected tests
        id: select
        if: github.event_name == 'pull_request'
        run: |
          set +e
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > /tmp/eos-changed.txt 2>/tmp/eos-diff.err
          if [ $? -ne 0 ]; then echo "regex=" >> "$GITHUB_OUTPUT"; exit 0; fi
          REGEX=$(python3 tools/dep_graph.py select --files-from /tmp/eos-changed.txt --ctest-regex 2>/tmp/eos-select.err)
          if [ $? -ne 0 ]; then echo "regex=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "regex=$REGEX" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          if [ -n "${{ steps.select.outputs.regex }}" ]; then
            ctest --test-dir build --no-tests=ignore --output-on-failure -R "${{ steps.select.outputs.regex }}"
          else
            ctest --test-dir build --no-tests=ignore --output-on-failure
          fi
      - name: Post build failure to the pull request
        if: failure()
        run: |
          set +e
          # Resolve the pull request for this run; skip quietly when there is none.
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ] && command -v gh >/dev/null 2>&1; then
            # Push runs carry no pull_request payload; resolve via the commit.
            PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null)
          fi
          if [ -z "$PR" ]; then
            PR=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["number"] if isinstance(d, list) and d else "")' 2>/dev/null)
          fi
          if [ -z "$PR" ] && command -v gh >/dev/null 2>&1; then
            # Last resort: resolve by branch name.
            PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty' 2>/dev/null)
          fi
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No associated pull request; skipping failure comment."
            exit 0
          fi
          # Skip if a comment for this run was already posted (job re-runs share the run id).
          if command -v gh >/dev/null 2>&1; then
            if gh pr view "$PR" --json comments --jq '.comments[].body' 2>/dev/null | grep -q "$GITHUB_RUN_ID"; then
              echo "Failure comment already posted for this run; skipping."
              exit 0
            fi
          fi
          # Failing step name, from the run's job list when available.
          FAIL_STEP="Build"
          if command -v gh >/dev/null 2>&1; then
            FAIL_STEP=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name == "CMake build") | .steps[] | select(.conclusion == "failure") | .name] | first // "Build"' 2>/dev/null)
            [ -z "$FAIL_STEP" ] && FAIL_STEP="Build"
          elif [ ! -s build.log ]; then
            FAIL_STEP="before Build"
          fi
          # Tail of the build log, capped so the comment stays well under the limit.
          if [ -s build.log ]; then
            TAIL=$(tail -n 150 build.log | tail -c 30000)
          else
            TAIL="(no build log was produced; the failure happened before the Build step finished)"
          fi
          {
            echo "## CI build failure"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Job: CMake build"
            echo "Failing step: $FAIL_STEP"
            echo
            echo "Tail of build.log (last 150 lines, capped):"
            echo '```'
            echo "$TAIL"
            echo '```'
          } > /tmp/eos-failure-comment.md
          # Post exactly once; fail loudly if neither route works so a missing
          # comment shows up in the job metadata instead of staying silent.
          POSTED=0
          if command -v gh >/dev/null 2>&1; then
            echo "Posting failure comment via gh."
            if gh pr comment "$PR" --body-file /tmp/eos-failure-comment.md; then
              POSTED=1
            else
              echo "gh post failed; falling back to the API."
            fi
          fi
          if [ "$POSTED" -eq 0 ]; then
            echo "Posting failure comment via the API."
            BODY=$(python3 -c 'import json; print(json.dumps({"body": open("/tmp/eos-failure-comment.md").read()}))')
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR/comments" -d "$BODY")
            if [ "$CODE" = "201" ]; then
              POSTED=1
            else
              echo "API post failed with HTTP $CODE."
            fi
          fi
          if [ "$POSTED" -eq 1 ]; then
            echo "Failure comment posted."
            exit 0
          fi
          echo "ERROR: could not post the failure comment by either route."
          exit 1
