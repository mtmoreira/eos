name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: Structure and layer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: pip install pyyaml pytest
      - name: Layer and structure check
        run: python3 tools/check_layers.py
      - name: Dependency graph check
        run: python3 tools/dep_graph.py check
      - name: Shell script syntax check
        run: |
          bash -n scripts/setup-macos.sh
          bash -n scripts/build-macos.sh
      - name: Checker unit tests
        run: python3 -m pytest tools/tests -q

  build:
    name: CMake build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the pull-request selection step can diff
          # against the base commit. Push runs (including merge
          # commits) always run the full suite, so they do not use it.
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y tcl-dev bison flex libfl-dev swig libeigen3-dev libboost-dev libboost-serialization-dev zlib1g-dev libspdlog-dev libfmt-dev liblemon-dev qt6-base-dev qt6-base-dev-tools
      - name: Cache OR-Tools (P2 declared external dependency, never vendored)
        id: cache-ortools
        uses: actions/cache@v4
        with:
          # Exact asset version in the key, so a version bump never
          # restores a stale install. The GitHub release download
          # flaps between 200 and 504, so a cold cache must not
          # fail the whole run; the install step retries the
          # download when it has to fetch.
          path: ~/or-tools
          key: or-tools-9.5.2237-ubuntu-22.04
      - name: Install OR-Tools (P2 declared external dependency, never vendored)
        if: steps.cache-ortools.outputs.cache-hit != 'true'
        run: |
          curl --retry 5 --retry-delay 10 -L -o /tmp/or-tools.tar.gz https://github.com/google/or-tools/releases/download/v9.5/or-tools_amd64_ubuntu-22.04_cpp_v9.5.2237.tar.gz
          mkdir -p "$HOME/or-tools"
          tar -xzf /tmp/or-tools.tar.gz -C "$HOME/or-tools" --strip-components=1
      - name: Configure
        run: cmake -S . -B build -DEOS_BUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$HOME/or-tools"
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
      - name: Select affected tests
        id: select
        if: github.event_name == 'pull_request'
        run: |
          set +e
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > /tmp/eos-changed.txt 2>/tmp/eos-diff.err
          if [ $? -ne 0 ]; then echo "regex=" >> "$GITHUB_OUTPUT"; exit 0; fi
          REGEX=$(python3 tools/dep_graph.py select --files-from /tmp/eos-changed.txt --ctest-regex 2>/tmp/eos-select.err)
          if [ $? -ne 0 ]; then echo "regex=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "regex=$REGEX" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          if [ -n "${{ steps.select.outputs.regex }}" ]; then
            ctest --test-dir build --no-tests=ignore --output-on-failure -R "${{ steps.select.outputs.regex }}"
          else
            ctest --test-dir build --no-tests=ignore --output-on-failure
          fi
      - name: Post build failure to the pull request
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // Resolve the pull request for this run; skip quietly when there is none.
            let pr = context.payload.pull_request?.number;
            if (!pr) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              pr = data[0]?.number;
            }
            if (!pr) {
              core.info('No associated pull request; skipping failure comment.');
              return;
            }
            // Skip if a comment for this run was already posted (job re-runs share the run id).
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100,
            });
            if (comments.some(c => c.body.includes(String(context.runId)))) {
              core.info('Failure comment already posted for this run; skipping.');
              return;
            }
            // Failing step name, from the run's job list when available.
            let failStep = 'Build';
            try {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
              const job = jobs.jobs.find(j => j.name === 'CMake build');
              failStep = job?.steps.find(s => s.conclusion === 'failure')?.name ?? 'Build';
            } catch (e) {
              core.warning(`Could not list jobs for the failing step: ${e.message}`);
            }
            // Tail of the build log, capped so the comment stays well under the limit.
            let tail = '(no build log was produced; the failure happened before the Build step finished)';
            if (fs.existsSync('build.log')) {
              const lines = fs.readFileSync('build.log', 'utf8').split('\n').slice(-150).join('\n');
              tail = lines.slice(-30000);
            }
            const body = [
              '## CI build failure',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              'Job: CMake build',
              `Failing step: ${failStep}`,
              '',
              'Tail of build.log (last 150 lines, capped):',
              '```',
              tail,
              '```',
            ].join('\n');
            // Post exactly once; throw on failure so a missing comment shows up
            // in the job metadata instead of staying silent.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });
            core.info('Failure comment posted.');
