# Every adopted component: upstream, pinned version, licence, the
# module it lives in, and its local patch count. Pins were set on
# 2026-10-18 by the Phase 0 licence audit (docs/licence-audit.md).
# A pin is the version EOS evaluates and imports first; changing a
# pin is a reviewed change in its own commit, with a reason.
components:
  - name: slang
    upstream: https://github.com/MikePopoloski/slang
    version: v12.0
    licence: MIT
    module: src/synth/frontend (planned)
    patches: 0
  - name: yosys
    upstream: https://github.com/YosysHQ/yosys
    version: v0.70
    licence: ISC
    module: src/synth/yosys
    patches: 0
  - name: abc
    upstream: https://github.com/berkeley-abc/abc
    version: commit 416199292fbd
    licence: BSD-style (UC Regents custom permissive, copyright.txt)
    module: src/synth/abc
    patches: 0
  - name: mockturtle
    upstream: https://github.com/lsils/mockturtle
    version: v0.3
    licence: MIT
    module: src/synth/optimizers (planned)
    patches: 0
  - name: opensta
    upstream: https://github.com/The-OpenROAD-Project/OpenSTA
    version: commit 0f2529d18218
    licence: GPL-3.0 (dual-licensed; commercial licence from Parallax)
    module: src/analysis/timing/sta
    patches: 0
    note: The only release tag is v2.2.0 (2020), so EOS pins commits.
  - name: opendb
    upstream: https://github.com/The-OpenROAD-Project/OpenROAD (src/odb)
    version: commit ead3236e56d57
    licence: BSD-3-Clause
    module: src/db/odb
    patches: 0
    note: "Re-pinned 2026-10-28 by fix track unit REPIN (authorized by the project owner the same day) from v2.0 (commit a5a56584fed1), per docs/odb-repin-decision.md Sections 5 and 6: the v2.0 reader rejects ORFS v3.0 database binaries (schema minor 74 against its 51), and ead3236 is the OpenROAD pin of ORFS v3.0, the writer of the subject file. EOS WriteDb checkpoints move from schema 51 to 74 with this pin; none are stored."
  - name: openroad-modules
    upstream: https://github.com/The-OpenROAD-Project/OpenROAD
    version: v2.0 (commit a5a56584fed1)
    licence: BSD-3-Clause
    module: src/pd and src/pv (per-pass provenance at import time)
    patches: 0
    note: "Stays at v2.0 while opendb moves to ead3236 (fix track unit REPIN, 2026-10-28): its only imported-as-planned consumer, src/synth/openroad-syn, is a planned adoption not yet imported, so the split costs a note, not code."
  - name: klayout
    upstream: https://github.com/KLayout/klayout
    version: v0.30.12
    licence: GPL-3.0
    module: src/io/gds and src/pv (planned)
    patches: 0
  - name: magic
    upstream: https://github.com/RTimothyEdwards/magic
    version: 8.3.685
    licence: BSD-style (UC Regents custom permissive, LICENSE)
    module: src/pv (planned)
    patches: 0
  - name: netgen
    upstream: https://github.com/RTimothyEdwards/netgen
    version: commit e5a185dcfa16
    licence: GPL-1.0 (per the Copying file; per-file headers rechecked at import)
    module: src/pv/lvs (planned)
    patches: 0
  - name: linenoise
    upstream: https://github.com/antirez/linenoise
    version: commit a473823d74b93eab2ba83480df16ed37617493f2
    licence: BSD-2-Clause
    module: src/ui/tcl
    patches: 0
    note: "Pinned 2026-10-29 for the interactive shell's line editing (history, tab completion of ::eos:: command names, persistent history file). GNU readline was deliberately not chosen: it is GPL-3.0 and would put a GPL component in the eos binary while the EOS licence is still deferred."
baseline_only:
  - name: orfs
    upstream: https://github.com/The-OpenROAD-Project/OpenROAD-flow-scripts
    version: tag v3.0 (commit 181e91337761)
    licence: BSD-3-Clause for the build and run scripts; designs and platforms carry their own licences
    role: Phase 0 reference flow for baseline metrics. Never imported into EOS.
  - name: open_pdks
    upstream: https://github.com/fossi-foundation/open-pdks
    version: commit abfc54bd87e0
    licence: Apache-2.0
    role: Builds the Sky130 PDK collateral that platforms/sky130 pins and hashes.
