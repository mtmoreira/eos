# EOS structure registry: layers and modules, enforced by
# tools/check_layers.py in CI. This file is structural: it changes
# only with Matheus approval (see the EOS Code Structure document).

layers:
  - id: L0
    level: 0
    name: foundation
    roots: [src/foundation]
  - id: L1
    level: 1
    name: io
    roots: [src/io]
  - id: L2
    level: 2
    name: design-data
    roots: [src/db, src/tech]
  - id: L3
    level: 3
    name: analysis
    roots: [src/analysis]
  - id: L4
    level: 4
    name: engines
    roots: [src/synth, src/pd, src/pv, src/eco]
  - id: L5
    level: 5
    name: session
    roots: [src/session]
  - id: L6
    level: 6
    name: interface
    roots: [src/ui]
modules:
  - name: types
    layer: L0
    path: src/foundation/types
    target: eda_foundation_types
    adopted: false
  - name: ids
