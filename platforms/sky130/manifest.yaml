known_gaps:
  - The ORFS v3.0 sky130hd platform ships only the tt_025C_1v80
    Liberty corner (findings F4); unit F1 records the additional
    corners from the pinned open_pdks build (see
    docs/sky130-package-multicorner.md). The RC collateral is
    still typical only. No ss or ff RC corner ships in either
    pinned tree, so every scenario pairs its PVT corner with
    the typical RC corner.
  - The two pinned tt_025C_1v80 Liberty files (ORFS platform and
    open_pdks build) are not byte-identical and disagree on
    pg_type for 850 of 1729 pg pins (finding M3 in the unit F1
    record); both are recorded with distinct hashes and are
    never substituted for each other.
  - The ccsnoise Liberty variants are recorded as collateral
    but define no scenario. They carry noise models for the
    ss_n40C_1v60 and ff_n40C_1v95 operating conditions, not
    separate PVT corners.
  - The cell CDL carries the macro_sparecell / conb_1 pin-count
    defect recorded as finding F1; it is recorded, never patched.
